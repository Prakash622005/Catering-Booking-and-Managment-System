name: Catering Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GITHUB OIDC PERMISSIONS
# ============================================================

permissions:
  id-token: write
  contents: read


jobs:

  # ============================================================
  # BACKEND BUILD AND TEST
  # ============================================================

  backend-build-test:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # --------------------------------------------------------
      # Service Registry
      # --------------------------------------------------------

      - name: Build and test Service Registry
        working-directory: ./catering-microservices/service-registry
        run: mvn -B clean verify


      # --------------------------------------------------------
      # API Gateway
      # --------------------------------------------------------

      - name: Build and test API Gateway
        working-directory: ./catering-microservices/api-gateway-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Auth Service
      # --------------------------------------------------------

      - name: Build and test Auth Service
        working-directory: ./catering-microservices/auth-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Menu Service
      # --------------------------------------------------------

      - name: Build and test Menu Service
        working-directory: ./catering-microservices/menu-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Booking Service
      # --------------------------------------------------------

      - name: Build and test Booking Service
        working-directory: ./catering-microservices/booking-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Quotation Service
      # --------------------------------------------------------

      - name: Build and test Quotation Service
        working-directory: ./catering-microservices/quotation-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Payment Service
      # --------------------------------------------------------

      - name: Build and test Payment Service
        working-directory: ./catering-microservices/payment-service
        run: mvn -B clean verify


      # --------------------------------------------------------
      # Notification Service
      # --------------------------------------------------------

      - name: Build and test Notification Service
        working-directory: ./catering-microservices/notification-service
        run: mvn -B clean verify



  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Node.js 24
      # --------------------------------------------------------

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false


      # --------------------------------------------------------
      # Check frontend files
      # --------------------------------------------------------

      - name: Check frontend files
        working-directory: ./catering-microservices/mks-catering-frontend
        run: |
          pwd
          ls
          test -f package.json
          test -f package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: ./catering-microservices/mks-catering-frontend
        run: npm ci


      # --------------------------------------------------------
      # Build React frontend
      # --------------------------------------------------------

      - name: Build React frontend
        working-directory: ./catering-microservices/mks-catering-frontend
        run: npm run build



  # ============================================================
  # DOCKER BUILD AND PUSH TO AWS ECR
  # ============================================================

  docker-build:

    # ----------------------------------------------------------
    # Only push Docker images to ECR when code is pushed
    # directly to main.
    #
    # Pull requests will run backend/frontend CI but will NOT
    # access AWS or push images to ECR.
    # ----------------------------------------------------------

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    needs:
      - backend-build-test
      - frontend-build

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # AWS OIDC AUTHENTICATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::888163088289:role/GitHubActions-ECR-Push-Role
          role-session-name: GitHubActions-ECR-Push
          aws-region: ap-south-1
          allowed-account-ids: "888163088289"


      # ========================================================
      # LOGIN TO AMAZON ECR
      # ========================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # SERVICE REGISTRY
      # ========================================================

      - name: Build and push Service Registry
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/service-registry
          file: ./catering-microservices/service-registry/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-service-registry:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-service-registry:${{ github.sha }}


      # ========================================================
      # API GATEWAY
      # ========================================================

      - name: Build and push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/api-gateway-service
          file: ./catering-microservices/api-gateway-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-api-gateway:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-api-gateway:${{ github.sha }}


      # ========================================================
      # AUTH SERVICE
      # ========================================================

      - name: Build and push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/auth-service
          file: ./catering-microservices/auth-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-auth-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-auth-service:${{ github.sha }}


      # ========================================================
      # MENU SERVICE
      # ========================================================

      - name: Build and push Menu Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/menu-service
          file: ./catering-microservices/menu-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-menu-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-menu-service:${{ github.sha }}


      # ========================================================
      # BOOKING SERVICE
      # ========================================================

      - name: Build and push Booking Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/booking-service
          file: ./catering-microservices/booking-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-booking-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-booking-service:${{ github.sha }}


      # ========================================================
      # QUOTATION SERVICE
      # ========================================================

      - name: Build and push Quotation Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/quotation-service
          file: ./catering-microservices/quotation-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-quotation-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-quotation-service:${{ github.sha }}


      # ========================================================
      # PAYMENT SERVICE
      # ========================================================

      - name: Build and push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/payment-service
          file: ./catering-microservices/payment-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-payment-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-payment-service:${{ github.sha }}


      # ========================================================
      # NOTIFICATION SERVICE
      # ========================================================

      - name: Build and push Notification Service
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/notification-service
          file: ./catering-microservices/notification-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-notification-service:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-notification-service:${{ github.sha }}


      # ========================================================
      # REACT FRONTEND
      # ========================================================

      - name: Build and push React Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./catering-microservices/mks-catering-frontend
          file: ./catering-microservices/mks-catering-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/catering-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/catering-frontend:${{ github.sha }}