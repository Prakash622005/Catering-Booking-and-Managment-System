server:
  port: 8080

spring:
  application:
    name: API-GATEWAY-SERVICE

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true

        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            allowedHeaders:
              - "*"
            allowCredentials: true
          exposedHeaders:
                - "Authorization"

      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: menu-service
          uri: lb://MENU-SERVICE
          predicates:
            - Path=/menus/**

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/bookings/**

        - id: quotation-service
          uri: lb://QUOTATION-SERVICE
          predicates:
            - Path=/quotations/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://catering-service-registry:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG